services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    stop_grace_period: 30s
    # Shared memory for raw decoded frames. Rule of thumb per camera at 1280x720
    # detect resolution: (1280 * 720 * 1.5 * 20 + 270480) / 1048576 ≈ 27 MB.
    # 800 MB covers 20 cameras with headroom; raise if you increase detect resolution.
    shm_size: "800mb"
    devices:
      - /dev/bus/usb:/dev/bus/usb                # Google Coral USB TPU(s)
      - /dev/dri/renderD128:/dev/dri/renderD128  # Intel N150 iGPU (VAAPI hwaccel)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate/config:/config
      - ${FRIGATE_MEDIA_PATH:-/mnt/frigate-media}:/media/frigate
      # 1 GB in-memory cache for recording segments — reduces SSD wear
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"      # Web UI (authenticated, TLS)
      - "8554:8554"      # RTSP restream
      - "8555:8555/tcp"  # WebRTC
      - "8555:8555/udp"  # WebRTC
    env_file: .env
    depends_on:
      - mosquitto

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    # Host networking is required for device discovery (mDNS/SSDP) and is the
    # configuration supported by Home Assistant. UI is served on port 8123.
    network_mode: host
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro

volumes:
  mosquitto-data:
  mosquitto-log:
